# GLM 5.2 (Zhipu / z.ai) via Together — HIGH reasoning.
# Together rejects top-level reasoning_effort (litellm UnsupportedParamsError);
# GLM's chat template reads `reasoning_effort`, so it is passed via extra_body
# (raw passthrough). Verified end-to-end: extra_body.reasoning_effort=high emits
# a real reasoning trace. max_tokens pinned (litellm has no model_info for this
# model, so max_tokens:null would raise).
model: together_ai/zai-org/GLM-5.2
temperature: 1.0
top_p: 0.95
max_tokens: 131072        # 128K output budget (per spec)
num_retries: 10
extra_body:
  reasoning_effort: high
